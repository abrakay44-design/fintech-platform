[package]
name = "grpc-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
common = { path = "../common" }
orchestrator = { path = "../orchestrator" }
transaction-engine = { path = "../transaction-engine" }
policy-engine = { path = "../policy-engine" }
wallet-service = { path = "../wallet-service" }
ledger = { path = "../ledger" }

tonic = "0.12"
prost = "0.13"
tokio = { version = "1.40", features = ["full", "signal"] }
tokio-stream = "0.1"
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
serde_json.workspace = true
hex.workspace = true
tonic-reflection = "0.12"

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "grpc-server"
path = "src/main.rs"
