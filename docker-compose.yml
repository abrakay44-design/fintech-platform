services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: fintech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rust-core:
    build:
      context: .
      dockerfile: rust-core/grpc-server/Dockerfile
    restart: unless-stopped
    environment:
      GRPC_ADDR: "0.0.0.0:50051"
      RUST_LOG: "info,grpc_server=debug"
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/50051' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  go-gateway:
    build:
      context: ./go-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GRPC_TARGET: "rust-core:50051"
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      rust-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
